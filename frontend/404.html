<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0d0f12">
<title>404 — SpaceCaptain</title>
<script>
  // Gleiches Muster wie index.html/display.html: zentral konfigurierter
  // Hell-/Dunkelmodus, synchron geladen damit kein Flackern entsteht.
  try {
    var _thXhr = new XMLHttpRequest();
    _thXhr.open('GET', '/api/settings/public', false);
    _thXhr.send(null);
    if (_thXhr.status === 200) {
      var _thSettings = JSON.parse(_thXhr.responseText);
      var _thTheme = _thSettings.public_pages_theme === 'light' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', _thTheme);
    }
  } catch (e) {}
</script>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@400;600;700;900&family=Barlow+Condensed:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0d0f12;--surface:#151820;--border:#2a2f3e;
    --accent:#f4a622;--text:#e2e8f0;--text-dim:#a8bece;
    --mono:'Share Tech Mono',monospace;--body:'Barlow',sans-serif;--display:'Barlow Condensed',sans-serif;
  }
  :root[data-theme="light"] {
    --bg:#f4f6f8;--surface:#ffffff;--border:#d8dee6;
    --accent:#b45309;--text:#0f172a;--text-dim:#475569;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:var(--body);min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
  .box{max-width:440px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px}
  .emoji{font-size:64px;line-height:1}
  h1{font-family:var(--display);font-size:32px;font-weight:900;letter-spacing:2px;color:var(--accent)}
  .sub{font-family:var(--mono);font-size:12px;color:var(--text-dim);letter-spacing:3px;text-transform:uppercase}
  p{font-size:15px;line-height:1.7;color:var(--text-dim)}
  a.btn{margin-top:8px;display:inline-block;padding:12px 24px;border-radius:8px;background:var(--accent);color:#000;font-weight:700;text-decoration:none;font-size:14px}
</style>
</head>
<body>
  <div class="box">
    <div class="emoji">🍝</div>
    <h1>404 — SPAGHETTI-DRUCK</h1>
    <div class="sub">Error: Support-Strukturen fehlen</div>
    <p>Diese Seite existiert so wenig wie ein perfekter First Layer ohne Bett-Nivellierung. Vermutlich hast du dich in der URL vertippt — passiert schnell, genau wie beim G-Code von Hand editieren.</p>
    <a class="btn" href="/">← Zurück ins Lab</a>
  </div>
</body>
</html>
